<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI見積もりチャットボット</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI見積もりチャット</h1>
            <div class="company-info">
                <a href="tel:0120-XXX-XXXX" class="contact-link phone-link">
                    <span class="icon">📞</span>
                    <span>0120-XXX-XXXX</span>
                </a>
                <a href="mailto:info@example.com" class="contact-link email-link">
                    <span class="icon">✉️</span>
                    <span>info@example.com</span>
                </a>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <div class="message bot-message">
                    <div class="message-avatar bot-avatar">
                        <img src="images/receptionist.png" alt="AI受付"
                             style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%233B82F6\'/%3E%3Ctext x=\'50\' y=\'65\' font-size=\'50\' text-anchor=\'middle\' fill=\'white\'%3E👩‍💼%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            こんにちは！リフォームのお見積もりをお手伝いします。<br>
                            どのようなリフォームをご希望ですか？<br><br>
                            例：トイレ、お風呂、キッチン、外壁塗装など
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <input
                type="text"
                id="userInput"
                placeholder="メッセージを入力..."
                autocomplete="off"
            >
            <button id="sendButton">送信</button>
        </div>

        <div class="total-display" id="totalDisplay" style="display: none;">
            <div class="total-content">
                <div class="total-info">
                    <span class="total-label">お見積もり合計金額</span>
                    <span class="total-amount" id="totalAmount">¥0</span>
                </div>
                <div class="total-actions">
                    <a href="tel:0120-XXX-XXXX" class="action-button phone-button">
                        <span class="button-icon">📞</span>
                        <span>電話する</span>
                    </a>
                    <a href="mailto:info@example.com" class="action-button email-button">
                        <span class="button-icon">✉️</span>
                        <span>メール</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
